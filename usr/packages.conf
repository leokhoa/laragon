# PostgreSQL
# https://www.enterprisedb.com/download-postgresql-binaries
#
# Laragon expects: bin\postgresql\postgresql-<version>\bin\postgres.exe
# The EDB zip unpacks to a single "pgsql" folder - rename it to the package
# name below if it is not renamed for you.
#
# Default port is 5432 (Menu > Preferences > Services & Ports).
# The first start runs initdb into data\, then creates the "postgres"
# superuser and database. Manage it via Menu > PostgreSQL.

postgresql-18.4=https://get.enterprisedb.com/postgresql/postgresql-18.4-1-windows-x64-binaries.zip
