# Web Servers
#
# Apache Lounge deletes older builds as soon as a new one ships, and a
# removed file still answers 200 - with a 2 KB HTML error page instead of
# the archive. Quick add then "succeeds" and unpacks nothing, so these
# entries need re-checking whenever Apache Lounge publishes a new build.
# The date in the filename is part of the build, not decoration.
Apache-2.4.68=https://www.apachelounge.com/download/VS18/binaries/httpd-2.4.68-260617-Win64-VS18.zip
Apache-2.4.57=https://www.apachelounge.com/download/VS16/binaries/httpd-2.4.57-win64-VS16.zip
