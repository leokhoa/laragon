# Adminer is the web UI for PostgreSQL (phpMyAdmin is MySQL-only).
# It ships as a single .php file, so Quick add cannot unpack it - it lives at
# etc\apps\adminer\adminer.php and is served at http://localhost/adminer
# (index.php next to it is Laragon's wrapper - keep it when upgrading).
# Upgrade with:  curl -L -o etc\apps\adminer\adminer.php ^
#   https://github.com/vrana/adminer/releases/download/v5.5.1/adminer-5.5.1.php
